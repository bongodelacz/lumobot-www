<section class="ap-page" aria-labelledby="ap-title">
  <header class="ap-head wrap">
    <p class="eyebrow">Aplikacja</p>

      <h1 class="display" id="ap-title">Wpisz zadanie. Odbierz gotowy wynik</h1>
    </div>
    <p class="lede">LumoBot korzysta z aktywnej subskrypcji AI i pracuje w twoim folderze, aż sprawdzony wynik będzie gotowy.</p>

  </div>

  <div class="ap-frame-wrap">
    <a class="ap-full" href="app/index.html" target="_blank" rel="noopener">Otwórz okno na cały ekran</a>

      <iframe id="appiframe" src="app/index.html" title="Okno aplikacji LumoBot" loading="eager"></iframe>
    </div>
